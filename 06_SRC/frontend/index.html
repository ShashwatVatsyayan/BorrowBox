<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#080C0A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <title>BorrowBox - Campus Peer-to-Peer Borrowing Platform</title>
    <meta name="description" content="Borrow and lend calculators, lab coats, drafting tools, and textbooks directly with verified university peers." />
    <meta name="keywords" content="BorrowBox, campus lending, student sharing, Chandigarh University, textbook sharing, peer borrowing" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://borrowbox-lime.vercel.app/" />
    <meta property="og:title" content="BorrowBox - Campus Peer-to-Peer Borrowing" />
    <meta property="og:description" content="Borrow and lend academic essentials with verified university students." />
    <meta property="og:image" content="https://borrowbox-lime.vercel.app/logo.svg" />

    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BorrowBox - Campus Peer Borrowing" />
    <meta name="twitter:description" content="Borrow and lend academic essentials with verified university peers." />
    <meta name="twitter:image" content="https://borrowbox-lime.vercel.app/logo.svg" />

    <!-- Preconnect & Fonts for Editorial Typography: Plus Jakarta Sans & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />

    <!-- Preconnect & DNS-Prefetch to Supabase Cloud API -->
    <link rel="preconnect" href="https://nayvfsgvmwqgfphaxuzr.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://nayvfsgvmwqgfphaxuzr.supabase.co" />

    <!-- Asset Preload for Instant First Contentful Paint -->
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="/logo-dark.svg" as="image" type="image/svg+xml" />
  </head>
  <body class="bg-surface-base text-ink-primary antialiased font-sans min-h-screen">
    <div id="root"></div>

    <!-- Codemure Ink Bleed WebGL2 Transition Canvas -->
    <canvas id="ink-canvas" class="ink-canvas" aria-hidden="true" data-html2canvas-ignore=""></canvas>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
