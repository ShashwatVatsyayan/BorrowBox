<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BorrowBox - Campus Peer-to-Peer Sharing</title>
    <meta name="description" content="Borrow and lend textbooks, lab equipment, calculators, and tools with verified university peers." />
  </head>
  <body class="bg-surface-base text-ink-primary antialiased font-sans min-h-screen">
    <div id="root"></div>

    <!-- Ink Bleed Filter definition (adapted from https://github.com/codemure-official/ink-bleed-theme-changer) -->
    <svg style="position: fixed; width: 0; height: 0; pointer-events: none; opacity: 0;" aria-hidden="true">
      <defs>
        <filter id="ink-bleed-filter" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="4" result="noise" seed="42" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="30" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
