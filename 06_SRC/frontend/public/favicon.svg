<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="BorrowBox Favicon">
  <defs>
    <style>
      .fav-bg { fill: #0F382A; }
      .fav-box { stroke: #F5F2EB; }
      .fav-lid { stroke: #10B981; }
      .fav-arrow { stroke: #D4A853; }
      @media (prefers-color-scheme: light) {
        .fav-bg { fill: #0F382A; }
        .fav-box { stroke: #F5F2EB; }
        .fav-lid { stroke: #10B981; }
        .fav-arrow { stroke: #D4A853; }
      }
    </style>
  </defs>
  <!-- Rounded Container -->
  <rect class="fav-bg" x="24" y="24" width="252" height="252" rx="60" fill="#0F382A"/>
  <!-- Isometric Open Box Base -->
  <path class="fav-box" d="M82 111.5 150 74l68 37.5v76L150 225l-68-37.5z" fill="none" stroke="#F5F2EB" stroke-width="11" stroke-linejoin="round"/>
  <path class="fav-box" d="m82 111.5 68 39 68-39M150 150.5V225" fill="none" stroke="#F5F2EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top Flaps / Wings -->
  <path class="fav-lid" d="M101 91.5 150 64l49 27.5" fill="none" stroke="#10B981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Curved Peer Sharing Loop with Arrow -->
  <path class="fav-arrow" d="M108 174c8 17 23 27 42 27 17 0 31-8 40-21" fill="none" stroke="#D4A853" stroke-width="10" stroke-linecap="round"/>
  <path class="fav-arrow" d="m180 180 10 0 0 10" fill="none" stroke="#D4A853" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
